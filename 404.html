<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magic Domino</title>

<!--
  ============================================================================
  404 — AND THE PAGE BEHIND A SHARED CODE
  ============================================================================
  ⚠️ THIS FILE HAS TO BE THE ROOT 404, and that is a constraint of GitHub Pages
     rather than a choice. A share link looks like /j/X5JJVP, and Pages serves
     only real files — there is no rewrite rule and no per-folder fallback. It
     looks for that path, finds nothing, and serves the root 404.html. So the
     404 page IS the landing page.

  ✅ WITH THE APP INSTALLED, NOBODY EVER SEES THIS. iOS reads the association
     file at /.well-known/apple-app-site-association and opens Magic Domino
     directly. This is what someone WITHOUT the app gets — and without it a
     scanned QR is a dead end for exactly the person you most want to reach.

  It still behaves as a normal 404 for any other missing page, so it doesn't
  cost the site anything.
  ============================================================================
-->

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 32px;
    background: #0b0d10;
    color: #f2f4f7;
    text-align: center;
    font: 400 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 22px; font-weight: 700; margin: 0; }
  p  { margin: 0; color: #9aa4b2; max-width: 32ch; }
  .code {
    font: 700 44px/1 ui-rounded, -apple-system, sans-serif;
    letter-spacing: 6px;
    color: #5b9bd5;
    padding: 18px 26px;
    border-radius: 18px;
    background: #14181d;
  }
  a.btn {
    display: inline-block;
    text-decoration: none;
    font-weight: 600;
    padding: 15px 30px;
    border-radius: 999px;
    background: #5b9bd5;
    color: #0b0d10;
  }
  small { color: #6b7480; }
  /* Whichever branch doesn't apply is removed by script below. */
  #shared, #missing { display: none; flex-direction: column; align-items: center; gap: 22px; }
</style>
</head>
<body>

<div id="shared">
  <h1>Someone shared a game with you</h1>
  <div class="code" id="code"></div>
  <p>Open Magic Domino, tap Share, then Enter code.</p>
  <a class="btn" href="https://apps.apple.com/app/id6747228055">Get Magic Domino</a>
  <small>Free to join. No account needed.</small>
</div>

<div id="missing">
  <h1>Page not found</h1>
  <p>That page doesn't exist.</p>
  <a class="btn" href="/">Go to Magic Domino</a>
</div>

<script>
  (function () {
    var path  = window.location.pathname;
    var parts = path.split("/").filter(Boolean);
    var last  = (parts[parts.length - 1] || "").toUpperCase();

    // Only treat it as a share when the path really is /j/SOMETHING and that
    // something looks like a code — never echo back whatever was in the URL.
    var isShare = parts[0] === "j" && /^[A-Z0-9]{4,8}$/.test(last);

    if (isShare) {
      document.getElementById("code").textContent = last;
      document.getElementById("shared").style.display = "flex";
    } else {
      document.getElementById("missing").style.display = "flex";
    }
  })();
</script>
</body>
</html>
